<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Kiremit Pike Takımı</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff5f9;
}

.baslik {
    background: #ff1493;
    color: white;
    text-align: center;
    padding: 25px;
    font-size: 28px;
    font-weight: bold;
}

.urun-detay {
    max-width: 950px;
    margin: 50px auto;
    background: white;
    border-radius: 25px;
    padding: 30px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.15);

    display: flex;
    gap: 40px;
    align-items: center;
    flex-wrap: wrap;
}

.urun-detay img {
    width: 400px;
    max-width: 100%;
    border-radius: 20px;
}

.bilgi {
    flex: 1;
    min-width: 280px;
}

.bilgi h1 {
    color: #e91e63;
}

.bilgi p {
    color: #555;
    font-size: 18px;
    line-height: 1.7;
}

.fiyat {
    color: #ff1493;
    font-size: 30px;
    font-weight: bold;
}

.sepete-ekle {
    background: #ffcc00;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.geri {
    display: block;
    width: max-content;
    margin: 30px auto;

    background: #e91e63;
    color: white;

    text-decoration: none;

    padding: 13px 25px;
    border-radius: 30px;

    font-weight: bold;
}

</style>

</head>

<body>

<div class="baslik">
    🧵 Yargıl Terzi
</div>


<div class="urun-detay">

    <img src="Pike kiremit-2.jpg"
         alt="Premium Kiremit Pike Takımı">


    <div class="bilgi">

        <h1>
            🌻 Premium Kiremit Pike Takımı
        </h1>


        <p>
            Sıcak kiremit tonları ve zarif tasarımıyla
            yatak odanıza şık ve modern bir görünüm kazandırır.
        </p>


        <p>✔️ Yumuşak ve kaliteli kumaş</p>

        <p>✔️ Şık modern tasarım</p>

        <p>✔️ Kolay yıkanabilir</p>

        <p>✔️ Çift kişilik</p>


        <div class="fiyat">
            ₺2699
        </div>


        <br>


        <button class="sepete-ekle"
                onclick="sepeteEkle()">

            🛒 Sepete Ekle

        </button>

    </div>

</div>


<a href="Index.html" class="geri">

    ← Alışverişe Dön

</a>


<script>

function sepeteEkle() {

    alert("🛒 Premium Kiremit Pike Takımı sepete eklendi!");

}

</script>


</body>

</html>
