<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartla Ödeme</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .odeme-kutu {
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .iki-kutu {
            display: flex;
            gap: 10px;
        }

        .iki-kutu div {
            flex: 1;
        }

        .kart-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .geri {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="odeme-kutu">

    <h1>💳 Kartla Ödeme</h1>

    <label>Kart Üzerindeki İsim</label>
    <input type="text" placeholder="Ad Soyad">

    <label>Kart Numarası</label>
    <input type="text" maxlength="19" placeholder="1234 5678 9012 3456">

    <div class="iki-kutu">

        <div>
            <label>Son Kullanma</label>
            <input type="text" maxlength="5" placeholder="AA/YY">
        </div>

        <div>
            <label>CVV</label>
            <input type="password" maxlength="3" placeholder="123">
        </div>

    </div>

    <button class="kart-btn" onclick="odemeYap()">
        🔒 Ödemeyi Tamamla
    </button>

    <a href="index.html" class="geri">
        ← Alışverişe geri dön
    </a>

</div>

<script>
function odemeYap() {
    alert("Ödeme bilgileri kontrol ediliyor...");
}
</script>

</body>
</html>
