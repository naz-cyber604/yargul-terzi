<!DOCTYPE html>

<title>Pembe Rüya Pike</title>

<style>
body {

    text-align: center;
    padding: 25px;
    font-size: 28px;

}

.urun-detay {
    max-width: 950px;

    background: white;

.urun-detay img {

.bilgi {

}

    font-size: 18px;

}

.fiyat {

    font-size: 30px;
    font-weight: bold;
}

.sepete-ekle {
    background: #ffcc00;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.geri {
    display: block;
    width: max-content;
    margin: 30px auto;
    background: #e91e63;
    color: white;
    text-decoration: none;
    padding: 13px 25px;

</div>

<a href="Index.html" class="geri">
